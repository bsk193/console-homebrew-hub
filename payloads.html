<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payload Mirror — CHH</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#09090d;color:#c8ced8;font-family:-apple-system,"Segoe UI",system-ui,sans-serif}

/* nav */
.nav{display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid #131320;position:sticky;top:0;background:#09090d;z-index:10}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.nav-mark{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#3b8cff,#1957c8);display:flex;align-items:center;justify-content:center;font:800 10px/1 -apple-system,"Segoe UI",system-ui,sans-serif;color:#fff;letter-spacing:-.01em}
.nav-name{font:700 13px/1 -apple-system,"Segoe UI",system-ui,sans-serif;color:#4a5a6e;letter-spacing:.06em;text-transform:uppercase}
.nav-sep{flex:1}
.nav a.nav-link{font:500 12px/1 -apple-system,"Segoe UI",system-ui,sans-serif;color:#3a4a5e;text-decoration:none;letter-spacing:.04em}
.nav a.nav-link:hover{color:#6a7a9e}
.btn-req{padding:7px 14px;border-radius:8px;background:linear-gradient(135deg,#3b8cff,#1957c8);color:#fff;font:600 12px/1 -apple-system,"Segoe UI",system-ui,sans-serif;border:none;cursor:pointer;letter-spacing:.02em;transition:filter .15s,transform .15s}
.btn-req:hover{filter:brightness(1.1);transform:translateY(-1px)}

/* main */
main{max-width:1080px;margin:0 auto;padding:32px 24px 60px}
.page-header{margin-bottom:28px}
.page-header h1{font:700 26px/1 -apple-system,"Segoe UI",system-ui,sans-serif;color:#fff;letter-spacing:-.02em;margin-bottom:6px}
.page-header p{font-size:13px;color:#3e4f66}
.page-header .count{color:#3b8cff;font-weight:600}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;align-items:center}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:340px}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:#3a4a5e;pointer-events:none}
#search{width:100%;padding:9px 12px 9px 34px;background:#0d0d14;border:1px solid #1a1a24;border-radius:9px;color:#c8ced8;font:14px -apple-system,"Segoe UI",system-ui,sans-serif;outline:none;transition:border-color .15s}
#search::placeholder{color:#2a3040}
#search:focus{border-color:#2a3a60}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:6px 13px;border-radius:20px;background:#0d0d14;border:1px solid #1a1a24;color:#3a4a5e;font:500 12px/1 -apple-system,"Segoe UI",system-ui,sans-serif;cursor:pointer;transition:all .14s;user-select:none;-webkit-user-select:none}
.pill:hover{border-color:#2a3a60;color:#6a7a9e}
.pill.active{background:#131a2e;border-color:#2a4080;color:#6090e0}
.sort-wrap{margin-left:auto}
#sort{padding:8px 12px;background:#0d0d14;border:1px solid #1a1a24;border-radius:9px;color:#6a7a9e;font:13px -apple-system,"Segoe UI",system-ui,sans-serif;outline:none;cursor:pointer}

/* table */
.table-wrap{overflow-x:auto;border-radius:14px;border:1px solid #1a1a24}
table{width:100%;border-collapse:collapse;min-width:560px}
thead tr{border-bottom:1px solid #1a1a24}
thead th{padding:12px 16px;text-align:left;font:600 11px/1 -apple-system,"Segoe UI",system-ui,sans-serif;color:#3a4a5e;letter-spacing:.06em;text-transform:uppercase;background:#0a0a12;white-space:nowrap}
tbody tr{border-bottom:1px solid #111120;transition:background .12s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#0d0d1a}
td{padding:13px 16px;vertical-align:middle}
.td-name{font:600 14px/1.3 -apple-system,"Segoe UI",system-ui,sans-serif;color:#e0e6f0}
.td-ver{font:400 12px/1 -apple-system,"Segoe UI",system-ui,sans-serif;color:#3a4a5e;margin-top:3px}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font:500 11px/1 -apple-system,"Segoe UI",system-ui,sans-serif;background:#111828;color:#4a6898;border:1px solid #1a2840}
.td-date{font:400 12px/1 -apple-system,"Segoe UI",system-ui,sans-serif;color:#2e3a4e;white-space:nowrap}
.actions{display:flex;gap:7px;align-items:center}
.btn-dl,.btn-src{padding:6px 12px;border-radius:7px;font:600 11px/1 -apple-system,"Segoe UI",system-ui,sans-serif;text-decoration:none;transition:all .14s;white-space:nowrap}
.btn-dl{background:linear-gradient(135deg,#3b8cff,#1957c8);color:#fff;box-shadow:0 2px 8px rgba(25,87,200,.25)}
.btn-dl:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-src{background:#0d0d14;border:1px solid #1a1a24;color:#3a4a5e}
.btn-src:hover{border-color:#2a3a60;color:#6a7a9e}

/* empty */
.empty{text-align:center;padding:60px 20px;color:#2a3040;font-size:14px}

/* modal */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-backdrop.open{display:flex}
.modal{background:#0f0f18;border:1px solid #1e1e2e;border-radius:18px;padding:28px;width:100%;max-width:420px}
.modal h2{font:700 18px/1 -apple-system,"Segoe UI",system-ui,sans-serif;color:#fff;margin-bottom:8px;letter-spacing:-.01em}
.modal p{font-size:13px;color:#3e4f66;line-height:1.6;margin-bottom:20px}
.modal-fields{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.modal-fields input,.modal-fields textarea{width:100%;padding:10px 12px;background:#0a0a12;border:1px solid #1a1a28;border-radius:9px;color:#c8ced8;font:14px -apple-system,"Segoe UI",system-ui,sans-serif;outline:none;resize:vertical;transition:border-color .15s}
.modal-fields input:focus,.modal-fields textarea:focus{border-color:#2a4080}
.modal-fields input::placeholder,.modal-fields textarea::placeholder{color:#252538}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
.btn-cancel{padding:9px 18px;border-radius:9px;background:transparent;border:1px solid #1e1e2e;color:#3a4a5e;font:600 13px/1 -apple-system,"Segoe UI",system-ui,sans-serif;cursor:pointer}
.btn-submit{padding:9px 18px;border-radius:9px;background:linear-gradient(135deg,#3b8cff,#1957c8);color:#fff;font:600 13px/1 -apple-system,"Segoe UI",system-ui,sans-serif;border:none;cursor:pointer}
.btn-submit:hover{filter:brightness(1.1)}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="https://bsk193.github.io/">
    <div class="nav-mark">CHH</div>
    <span class="nav-name">Console Homebrew Hub</span>
  </a>
  <span class="nav-sep"></span>
  <a class="nav-link" href="exploits/" style="margin-right:14px">Exploits</a>
  <a class="nav-link" href="admin.html" style="margin-right:14px">Admin</a>
  <button class="btn-req" onclick="openModal()">+ Request Payload</button>
</nav>

<main>
  <div class="page-header">
    <h1>Payload Mirror</h1>
    <p>Mirrored PS5 payloads — <span class="count" id="count">loading…</span></p>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="search" type="text" placeholder="Search payloads…" oninput="render()">
    </div>
    <div class="filters" id="filters"></div>
    <div class="sort-wrap">
      <select id="sort" onchange="render()">
        <option value="name">Name A–Z</option>
        <option value="name-desc">Name Z–A</option>
        <option value="date" selected>Newest first</option>
        <option value="date-asc">Oldest first</option>
      </select>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Payload</th>
          <th>Category</th>
          <th>Updated</th>
          <th>Download</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">No payloads match your search.</div>
  </div>
</main>

<!-- Request modal -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h2>Request a Payload</h2>
    <p>Fill in the details below. This will open a pre-filled GitHub issue in the repository.</p>
    <div class="modal-fields">
      <input id="req-name" type="text" placeholder="Payload name (e.g. ftpsrv)">
      <input id="req-url" type="text" placeholder="GitHub releases URL">
      <textarea id="req-notes" rows="3" placeholder="Notes (optional)"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-submit" onclick="submitRequest()">Open GitHub Issue</button>
    </div>
  </div>
</div>

<script>
var allPayloads = [];
var activeCategory = 'All';

fetch('payloads.json')
  .then(function(r){ return r.json(); })
  .then(function(data){
    allPayloads = data;
    buildFilters();
    render();
  })
  .catch(function(){ document.getElementById('count').textContent = 'error loading payloads.json'; });

function buildFilters() {
  var cats = ['All'];
  allPayloads.forEach(function(p){ if (p.category && cats.indexOf(p.category) === -1) cats.push(p.category); });
  var wrap = document.getElementById('filters');
  cats.forEach(function(c){
    var el = document.createElement('span');
    el.className = 'pill' + (c === 'All' ? ' active' : '');
    el.textContent = c;
    el.onclick = function(){
      activeCategory = c;
      document.querySelectorAll('.pill').forEach(function(p){ p.classList.remove('active'); });
      el.classList.add('active');
      render();
    };
    wrap.appendChild(el);
  });
}

function fmtDate(s) {
  if (!s) return '—';
  try {
    var d = new Date(s);
    return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
  } catch(e){ return s; }
}

function render() {
  var q = document.getElementById('search').value.trim().toLowerCase();
  var sort = document.getElementById('sort').value;
  var items = allPayloads.filter(function(p){
    var inCat = activeCategory === 'All' || p.category === activeCategory;
    var inQ = !q || (p.name||'').toLowerCase().indexOf(q) !== -1
                 || (p.description||'').toLowerCase().indexOf(q) !== -1
                 || (p.category||'').toLowerCase().indexOf(q) !== -1;
    return inCat && inQ;
  });

  items.sort(function(a, b){
    if (sort === 'name') return (a.name||'').localeCompare(b.name||'');
    if (sort === 'name-desc') return (b.name||'').localeCompare(a.name||'');
    if (sort === 'date') return (b.last_update||'').localeCompare(a.last_update||'');
    if (sort === 'date-asc') return (a.last_update||'').localeCompare(b.last_update||'');
    return 0;
  });

  var tbody = document.getElementById('tbody');
  var empty = document.getElementById('empty');
  tbody.innerHTML = '';
  document.getElementById('count').textContent = allPayloads.length + ' payloads';

  if (!items.length) { empty.style.display='block'; return; }
  empty.style.display = 'none';

  items.forEach(function(p){
    var tr = document.createElement('tr');
    var dlBtn = p.url ? '<a class="btn-dl" href="'+esc(p.url)+'" download>&#8595; Mirror</a>' : '';
    var srcBtn = p.source ? '<a class="btn-src" href="'+esc(p.source)+'" target="_blank" rel="noopener">Source</a>' : '';
    tr.innerHTML =
      '<td><div class="td-name">'+esc(p.name||'—')+'</div>'
      + (p.version ? '<div class="td-ver">'+esc(p.version)+'</div>' : '')
      + '</td>'
      + '<td><span class="badge">'+esc(p.category||'—')+'</span></td>'
      + '<td class="td-date">'+esc(fmtDate(p.last_update))+'</td>'
      + '<td><div class="actions">'+dlBtn+srcBtn+'</div></td>';
    tbody.appendChild(tr);
  });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function openModal() { document.getElementById('modal').classList.add('open'); }
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('req-name').value = '';
  document.getElementById('req-url').value = '';
  document.getElementById('req-notes').value = '';
}
document.getElementById('modal').addEventListener('click', function(e){ if(e.target===this) closeModal(); });

function submitRequest() {
  var name = document.getElementById('req-name').value.trim();
  var url  = document.getElementById('req-url').value.trim();
  var notes= document.getElementById('req-notes').value.trim();
  var title = encodeURIComponent('Payload Request: ' + (name || 'new payload'));
  var body  = encodeURIComponent(
    '**Payload name:** ' + (name||'—') + '\n'
    + '**GitHub URL:** ' + (url||'—') + '\n'
    + (notes ? '**Notes:** ' + notes : '')
  );
  window.open('https://github.com/bsk193/ps5-payloads-mirror/issues/new?title='+title+'&body='+body+'&labels=payload-request', '_blank');
  closeModal();
}
</script>
</body>
</html>
