<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Console Homebrew Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#09090d;color:#c8ced8;font-family:-apple-system,"Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.logo-mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#3b8cff,#1957c8);display:flex;align-items:center;justify-content:center;font:800 14px/1 -apple-system,"Segoe UI",system-ui,sans-serif;color:#fff;letter-spacing:-.02em}
.logo-text{font:700 15px/1 -apple-system,"Segoe UI",system-ui,sans-serif;color:#4a5a6e;letter-spacing:.12em;text-transform:uppercase}
h1{font:700 30px/1.1 -apple-system,"Segoe UI",system-ui,sans-serif;color:#fff;text-align:center;letter-spacing:-.03em;margin-bottom:8px}
.sub{font-size:14px;color:#3e4f66;text-align:center;margin-bottom:44px}
.cards{display:flex;gap:14px;width:100%;max-width:560px;flex-wrap:wrap;justify-content:center}
.card{flex:1;min-width:220px;background:#0d0d14;border:1px solid #1a1a24;border-radius:14px;padding:26px 22px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,background .15s,transform .15s}
.card:hover{background:#111119;border-color:#252535;transform:translateY(-2px)}
.card-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.card-icon svg{width:20px;height:20px}
.card-mirror .card-icon{background:rgba(59,140,255,.12)}
.card-mirror .card-icon svg{stroke:#3b8cff}
.card-exploits .card-icon{background:rgba(16,185,129,.1)}
.card-exploits .card-icon svg{stroke:#10b981}
.card-title{font:600 15px/1 -apple-system,"Segoe UI",system-ui,sans-serif;color:#e0e6f0}
.card-desc{font:400 12px/1.6 -apple-system,"Segoe UI",system-ui,sans-serif;color:#3e4f66}
.card-cta{margin-top:6px;font:600 12px/1 -apple-system,"Segoe UI",system-ui,sans-serif;letter-spacing:.04em}
.card-mirror .card-cta{color:#3b8cff}
.card-exploits .card-cta{color:#10b981}
.ftr{margin-top:48px;font-size:11px;color:#1e1e2c;text-align:center}
</style>
</head>
<body>

<a class="logo" href="https://bsk193.github.io/" style="text-decoration:none">
  <div class="logo-mark">CHH</div>
  <span class="logo-text">Console Homebrew Hub</span>
</a>
<h1>Console Homebrew Hub</h1>

<div class="cards">
  <a class="card card-mirror" href="payloads.html">
    <div class="card-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    </div>
    <div class="card-title">Payload Mirror</div>
    <div class="card-cta">Browse payloads &rsaquo;</div>
  </a>

  <a class="card card-exploits" href="exploits/">
    <div class="card-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
    </div>
    <div class="card-title">Exploits</div>
    <div class="card-cta">View exploits &rsaquo;</div>
  </a>
</div>


</body>
</html>
