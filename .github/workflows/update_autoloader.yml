name: Update Autoloader Installers

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-autoloader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and publish latest autoloader assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p autoloader

          # All assets from bsk193/ps5-webkit-autoloader-x
          X_RELEASE=$(gh api repos/bsk193/ps5-webkit-autoloader-x/releases/latest)

          X_INSTALLER=$(echo "$X_RELEASE" | jq -r '.assets[] | select(.name | test("webkit-autoloader-installer.*\\.elf")) | .browser_download_url')
          curl -fsSL "$X_INSTALLER" -o autoloader/webkit-autoloader-x-installer.elf

          JB_LOCAL=$(echo "$X_RELEASE" | jq -r '.assets[] | select(.name | test("jailbreak-local-installer.*\\.elf")) | .browser_download_url')
          curl -fsSL "$JB_LOCAL" -o autoloader/jailbreak-local-installer.elf

          HOST_PY=$(echo "$X_RELEASE" | jq -r '.assets[] | select(.name | endswith(".py")) | .browser_download_url')
          curl -fsSL "$HOST_PY" -o autoloader/webkit-autoloader-host.py

          HOST_EXE=$(echo "$X_RELEASE" | jq -r '.assets[] | select(.name | endswith(".exe")) | .browser_download_url')
          curl -fsSL "$HOST_EXE" -o autoloader/webkit-autoloader-host.exe

          # Create release if it doesn't exist, then overwrite assets with stable filenames
          gh release create autoloader-latest \
            --title "Autoloader Installers (Latest)" \
            --notes "Latest autoloader installer ELFs and host scripts. Auto-updated daily from upstream repos." \
            --latest=false || true

          gh release upload autoloader-latest autoloader/* --clobber
