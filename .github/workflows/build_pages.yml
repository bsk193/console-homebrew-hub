name: Build GitHub Pages

on:
  workflow_run:
    workflows: [Automated Payloads Mirror]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone exploit cores
        run: |
          git clone --depth=1 https://github.com/idlesauce/umtx2.git ps5/exploits/umtx/core
          git clone --depth=1 https://github.com/idlesauce/PS5-Exploit-Host.git ps5/exploits/ipv6/core
          git clone --depth=1 https://github.com/jordyidk/slopkit.git ps5/exploits/slopkit/core

      - name: Download pldmgrx.elf
        run: |
          PLDMGRX_URL=$(curl -s https://api.github.com/repos/bsk193/ps5-payload-manager-x/releases/latest \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print(next(a['browser_download_url'] for a in r['assets'] if a['name'].endswith('.elf')))")
          curl -fsSL "$PLDMGRX_URL" -o pldmgrx.elf
          echo "Downloaded pldmgrx.elf ($(wc -c < pldmgrx.elf) bytes)"

      - name: Download chh-installer.elf
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Download from latest versioned release; skip gracefully if none exists yet
          RELEASE_TAG=$(gh release list --repo bsk193/console-homebrew-hub --limit 10 --json tagName \
            --jq '[.[] | select(.tagName | test("^v[0-9]"))] | .[0].tagName' 2>/dev/null || true)
          if [ -n "$RELEASE_TAG" ]; then
            gh release download "$RELEASE_TAG" --repo bsk193/console-homebrew-hub \
              --pattern "chh-installer.elf" --output chh-installer.elf
            echo "Downloaded chh-installer.elf from $RELEASE_TAG ($(wc -c < chh-installer.elf) bytes)"
          else
            echo "No versioned release found yet — skipping chh-installer.elf"
          fi

      - name: Rewrite absolute paths for GitHub Pages subpath
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          python3 - << 'PYEOF'
          import os, re

          repo   = os.environ['REPO']
          PREFIX = f'/{repo}'
          ROOT   = '.'
          EXTS   = {'.html', '.js', '.json'}

          PATTERN = re.compile(r'(?<![/])(["\'])(\/(?!\/))')

          def rewrite(text):
              return PATTERN.sub(lambda m: m.group(1) + PREFIX + '/', text)

          for dirpath, dirs, files in os.walk(ROOT):
              # Skip git internals and exploit cores (they use their own relative paths)
              dirs[:] = [d for d in dirs if d not in ('.git', '.github', 'core')]
              for fn in files:
                  if os.path.splitext(fn)[1] not in EXTS:
                      continue
                  path = os.path.join(dirpath, fn)
                  try:
                      with open(path, encoding='utf-8', errors='ignore') as f:
                          src = f.read()
                      out = rewrite(src)
                      if out != src:
                          with open(path, 'w', encoding='utf-8') as f:
                              f.write(out)
                          print('patched:', path)
                  except Exception as e:
                      print('skip:', path, e)
          PYEOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
