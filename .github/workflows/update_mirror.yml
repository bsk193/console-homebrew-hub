name: Automated Payloads Mirror

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Build Console Homebrew Hub Release]
    types: [completed]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Payloads Update Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python update_payloads.py

      - name: Generate per-payload version lists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/gen_versions.py

      - name: Upload payloads to latest versioned release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the latest versioned release tag (v*.*.*)
          RELEASE_TAG=$(gh release list --limit 10 --json tagName \
            --jq '[.[] | select(.tagName | test("^v[0-9]"))] | .[0].tagName' 2>/dev/null || true)
          if [ -z "$RELEASE_TAG" ]; then
            echo "No versioned release found — skipping payload upload."
            exit 0
          fi
          echo "Uploading payloads to release: $RELEASE_TAG"

          # Upload all payload binaries (main + version ELFs)
          if [ -d "payloads" ] && [ "$(ls -A payloads)" ]; then
            gh release upload "$RELEASE_TAG" payloads/* --clobber
          else
            echo "No payloads to upload."
          fi

      - name: Commit and Push payloads.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add payloads.json README.md versions/
          git commit -m "Auto-update payloads.json metadata" || echo "No changes to commit"
          git pull --rebase origin main
          git push

