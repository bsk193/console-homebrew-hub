name: Automated Payloads Mirror

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  actions: write

jobs:
  update-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Payloads Update Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python update_payloads.py

      - name: Create and Update payloads-mirror Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create release if it doesn't exist
          gh release create chh-latest \
            --title "Console Homebrew Hub v1.0.0" \
            --notes "CHH v1.0.0 — chh-installer.elf, chh-local-installer.elf, chh-host.exe, chh-host.py, plus mirrored PS5 payloads. Auto-updated daily." \
            --latest=false 2>/dev/null || true

          # Upload all payload binaries
          if [ -d "payloads" ] && [ "$(ls -A payloads)" ]; then
            echo "Uploading payloads to chh-latest release..."
            gh release upload chh-latest payloads/* --clobber
          else
            echo "No payloads to upload."
          fi

      - name: Commit and Push payloads.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add payloads.json README.md
          git commit -m "Auto-update payloads.json metadata" || echo "No changes to commit"
          git pull --rebase origin main
          git push

      - name: Deploy GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml
