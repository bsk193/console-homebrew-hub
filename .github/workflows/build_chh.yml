name: Build Console Homebrew Hub Release

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Build CHH ELFs (requires PS5 SDK via Docker) ─────────────────────────
  build-elfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout console-homebrew-hub
        uses: actions/checkout@v4
        with:
          path: chh

      - name: Clone ps5-webkit-autoloader-x
        run: |
          git clone --recurse-submodules --depth=1 \
            https://github.com/bsk193/ps5-webkit-autoloader-x.git autoloader-src

      - name: Patch autoloader-x for CHH
        run: |
          # Copy CHH-specific C source files from the CHH repo
          cp chh/chh-src/main_chh.c       autoloader-src/src/main_chh.c
          cp chh/chh-src/main_chh_local.c autoloader-src/src/main_chh_local.c

          # Append CHH extension function to app_installer.c
          cat chh/chh-src/app_installer_chh_patch.c >> autoloader-src/src/app_installer.c

          # (declaration is forward-declared inside main_chh.c / main_chh_local.c)

          # Append CHH Makefile targets (Python writes tabs correctly)
          python3 - << 'PYEOF'
          T = '\t'
          lines = [
              '',
              '# Console Homebrew Hub targets',
              'CHH_SRCS       := src/main_chh.c src/app_installer.c src/notification.c src/log.c',
              'CHH_LOCAL_SRCS := src/main_chh_local.c src/app_installer.c src/notification.c src/log.c',
              'CHH_LIBS       := $(LOCAL_LIBS)',
              '',
              '.PHONY: chh chh-local',
              'chh: chh-installer.elf',
              'chh-local: chh-local-installer.elf',
              '',
              '# icon0.png is pre-placed by CI (CHH custom artwork); skip icons target',
              'chh-installer.elf: version $(CHH_SRCS)',
              T + '$(CC) $(CFLAGS) $(LDFLAGS) -o chh-installer.elf $(CHH_SRCS) $(CHH_LIBS)',
              T + '$(STRIP) chh-installer.elf',
              '',
              'chh-local-installer.elf: version $(CHH_LOCAL_SRCS)',
              T + '$(CC) $(CFLAGS) $(LDFLAGS) -o chh-local-installer.elf $(CHH_LOCAL_SRCS) $(CHH_LIBS)',
              T + '$(STRIP) chh-local-installer.elf',
              '',
          ]
          with open('autoloader-src/Makefile', 'a') as f:
              f.write('\n'.join(lines) + '\n')
          print('Patched Makefile')
          PYEOF

          echo "All patches applied."

      - name: Install Pillow for icon resize
        run: pip install Pillow -q

      - name: Override PS5 icon with CHH artwork
        run: |
          python3 - << 'PYEOF'
          import os
          from PIL import Image
          img = Image.open('chh/chh-src/icon0.png').convert('RGBA')
          img = img.resize((512, 512), Image.LANCZOS)
          img.save('autoloader-src/assets/icon0.png')
          print(f'icon0.png written: 512x512, {os.path.getsize("autoloader-src/assets/icon0.png")} bytes')
          PYEOF

      - name: Cache Docker SDK image
        id: cache-docker
        uses: actions/cache@v4
        with:
          path: /tmp/ps5-sdk-image.tar
          key: ps5-sdk-${{ hashFiles('autoloader-src/Dockerfile.sdk') }}

      - name: Load cached Docker image
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: docker load -i /tmp/ps5-sdk-image.tar

      - name: Build Docker SDK image
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: docker build -t ps5-webkit-autoloader-sdk -f autoloader-src/Dockerfile.sdk autoloader-src/

      - name: Save Docker image for cache
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: docker save ps5-webkit-autoloader-sdk -o /tmp/ps5-sdk-image.tar

      - name: Build CHH ELFs
        run: |
          docker run --rm -u "$(id -u):$(id -g)" \
            -v "$(pwd)/autoloader-src:/work" -w /work \
            ps5-webkit-autoloader-sdk \
            make chh chh-local
          ls -lh autoloader-src/chh-installer.elf autoloader-src/chh-local-installer.elf

      - name: Upload ELF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chh-elfs
          path: |
            autoloader-src/chh-installer.elf
            autoloader-src/chh-local-installer.elf

  # ── Build chh-host.exe on Windows ─────────────────────────────────────────
  build-host-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout console-homebrew-hub
        uses: actions/checkout@v4

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build chh-host.exe
        run: pyinstaller --onefile --name chh-host chh-host.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: chh-host-exe
          path: dist/chh-host.exe

  # ── Publish everything to chh-latest release ──────────────────────────────
  publish:
    runs-on: ubuntu-latest
    needs: [build-elfs, build-host-exe]
    steps:
      - name: Checkout console-homebrew-hub
        uses: actions/checkout@v4

      - name: Download ELF artifacts
        uses: actions/download-artifact@v4
        with:
          name: chh-elfs
          path: release-assets

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: chh-host-exe
          path: release-assets

      - name: Download pldmgrx.elf
        run: |
          PLDMGRX_URL=$(curl -s https://api.github.com/repos/bsk193/ps5-payload-manager-x/releases/latest \
            | python3 -c "import sys,json; r=json.load(sys.stdin); \
              print(next(a['browser_download_url'] for a in r['assets'] if a['name'].endswith('.elf')))")
          curl -fsSL "$PLDMGRX_URL" -o release-assets/pldmgrx.elf
          echo "pldmgrx.elf: $(wc -c < release-assets/pldmgrx.elf) bytes"

      - name: Copy chh-host.py
        run: |
          cp chh-host.py release-assets/
          echo "=== Release assets (CHH files — payload ELFs uploaded separately by update_mirror.yml) ==="
          ls -lh release-assets/

      - name: Publish chh-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create chh-latest \
            --title "Console Homebrew Hub" \
            --notes "CHH-specific ELFs, host scripts, and bundled PS4/PS5 payloads. Auto-updated daily." \
            --latest=false 2>/dev/null || true
          gh release upload chh-latest release-assets/* --clobber
          echo "Published: $(gh release view chh-latest --json assets --jq '.assets|length') assets"
