name: Build Console Homebrew Hub Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  CHH_VERSION: ${{ github.ref_name }}

jobs:
  # ── Build CHH ELFs (requires PS5 SDK via Docker) ─────────────────────────
  build-elfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout console-homebrew-hub
        uses: actions/checkout@v4
        with:
          path: chh

      - name: Clone ps5-webkit-autoloader-x
        run: |
          git clone --recurse-submodules --depth=1 \
            https://github.com/bsk193/ps5-webkit-autoloader-x.git autoloader-src

      - name: Download exploit cores
        run: |
          set -e
          download_core() {
            local name=$1 url=$2 dest=$3
            echo "Downloading $name exploit core..."
            curl -sL "$url" -o "/tmp/$name.zip"
            mkdir -p "$dest"
            unzip -qo "/tmp/$name.zip" -d "/tmp/$name-extract"
            # Move contents from the extracted root dir (repo-name-branch/) into dest
            local inner=$(ls "/tmp/$name-extract/")
            cp -r "/tmp/$name-extract/$inner/"* "$dest/"
            rm -rf "/tmp/$name.zip" "/tmp/$name-extract"
            echo "  $name: $(find "$dest" -type f | wc -l) files"
          }
          download_core slopkit \
            "https://github.com/jordyidk/slopkit/archive/refs/heads/main.zip" \
            "chh/ps5/exploits/slopkit/core"
          download_core umtx \
            "https://github.com/idlesauce/umtx2/archive/refs/heads/main.zip" \
            "chh/ps5/exploits/umtx/core"
          download_core ipv6 \
            "https://github.com/idlesauce/PS5-Exploit-Host/archive/refs/heads/main.zip" \
            "chh/ps5/exploits/ipv6/core"

      - name: Download pldmgrx.elf
        run: |
          # Fetch latest pldmgrx release asset
          PLDMGRX_URL=$(curl -s https://api.github.com/repos/bsk193/console-homebrew-hub/releases/latest \
            | python3 -c "import sys,json; assets=json.load(sys.stdin).get('assets',[]); urls=[a['browser_download_url'] for a in assets if 'pldmgrx' in a['name'] and a['name'].endswith('.elf')]; print(urls[0] if urls else '')")
          if [ -n "$PLDMGRX_URL" ]; then
            echo "Downloading pldmgrx from: $PLDMGRX_URL"
            curl -sL "$PLDMGRX_URL" -o chh/pldmgrx.elf
          else
            echo "pldmgrx.elf not found in release, skipping"
          fi

      - name: Stage web files for file registry
        run: |
          set -e
          STAGE="chh/_stage"
          mkdir -p "$STAGE"
          # Copy CHH web content
          cp -r chh/ps5 "$STAGE/ps5"
          [ -f chh/console-nav.js ] && cp chh/console-nav.js "$STAGE/"
          [ -f chh/pldmgrx.elf ] && cp chh/pldmgrx.elf "$STAGE/"
          echo "Staged $(find "$STAGE" -type f | wc -l) files"

      - name: Generate file registry
        run: |
          python3 chh/tools/gen_file_registry.py \
            chh/_stage \
            autoloader-src/include/file_registry.h \
            autoloader-src/include/file_registry.c

      - name: Patch autoloader-x for CHH
        run: |
          # Copy CHH-specific source files
          cp chh/chh-src/main.c           autoloader-src/src/main.c
          cp chh/chh-src/http_server.c    autoloader-src/src/http_server.c
          cp chh/chh-src/http_server.h    autoloader-src/include/http_server.h

          # Append CHH extension to app_installer.c
          cat chh/chh-src/app_installer_chh_patch.c >> autoloader-src/src/app_installer.c

          # Copy CHH param.json and icon
          cp chh/chh-src/param.json autoloader-src/assets/param.json

          # Override wkali.h defaults: title ID must match param.json,
          # and the app label shows in PS5 notifications
          sed -i 's/#define WKAL_TITLE_ID     "WKLX00001"/#define WKAL_TITLE_ID     "CHHM00001"/' autoloader-src/include/wkali.h
          sed -i 's/#define WKAL_APP_LABEL    "Jailbreak"/#define WKAL_APP_LABEL    "CHH"/' autoloader-src/include/wkali.h

          # Generate wkali_version.h (normally created by autoloader-x's
          # default target chain, but CHH bypasses it with a standalone target)
          echo '#define WKALI_VERSION "chh-'${CHH_VERSION}'"' > autoloader-src/include/wkali_version.h

          # Append CHH Makefile target
          python3 - << 'PYEOF'
          T = '\t'
          lines = [
              '',
              '# Console Homebrew Hub — full installer with embedded HTTP server',
              'CHH_SRCS := src/main.c src/http_server.c src/app_installer.c \\',
              '            src/notification.c src/log.c src/inflate.c',
              'CHH_LIBS := $(TARGET)/lib/libmicrohttpd.a \\',
              '            -L$(TARGET)/lib -lpthread \\',
              '            -lSceNetCtl -lSceUserService -lSceSystemService \\',
              '            -lSceAppInstUtil',
              'CHH_CFLAGS := -DWKAL_TITLE_ID=\'"CHHM00001"\'',
              '',
              '.PHONY: chh',
              'chh: chh-installer.elf',
              '',
              'chh-installer.elf: $(CHH_SRCS)',
              T + '$(CC) $(CFLAGS) $(CHH_CFLAGS) $(LDFLAGS) -o chh-installer.elf $(CHH_SRCS) include/file_registry.c $(CHH_LIBS)',
              T + '$(STRIP) chh-installer.elf',
              '',
          ]
          with open('autoloader-src/Makefile', 'a') as f:
              f.write('\n'.join(lines) + '\n')
          print('Patched Makefile with CHH target')
          PYEOF

          echo "All patches applied."

      - name: Install Pillow for icon resize
        run: pip install Pillow -q

      - name: Override PS5 icon with CHH artwork
        run: |
          python3 - << 'PYEOF'
          import os
          from PIL import Image
          img = Image.open('chh/chh-src/icon0.png').convert('RGBA')
          img = img.resize((512, 512), Image.LANCZOS)
          img.save('autoloader-src/assets/icon0.png')
          print(f'icon0.png written: 512x512, {os.path.getsize("autoloader-src/assets/icon0.png")} bytes')
          PYEOF

      - name: Cache Docker SDK image
        id: cache-docker
        uses: actions/cache@v4
        with:
          path: /tmp/ps5-sdk-image.tar
          key: ps5-sdk-${{ hashFiles('autoloader-src/Dockerfile.sdk') }}

      - name: Load cached Docker image
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: docker load -i /tmp/ps5-sdk-image.tar

      - name: Build Docker SDK image
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: docker build -t ps5-webkit-autoloader-sdk -f autoloader-src/Dockerfile.sdk autoloader-src/

      - name: Save Docker image for cache
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: docker save ps5-webkit-autoloader-sdk -o /tmp/ps5-sdk-image.tar

      - name: Build CHH ELF
        run: |
          docker run --rm -u "$(id -u):$(id -g)" \
            -v "$(pwd)/autoloader-src:/work" -w /work \
            ps5-webkit-autoloader-sdk \
            make chh
          cp autoloader-src/chh-installer.elf autoloader-src/chh-installer_${{ env.CHH_VERSION }}.elf
          ls -lh autoloader-src/chh-installer*.elf

      - name: Upload ELF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chh-elfs
          path: |
            autoloader-src/chh-installer.elf
            autoloader-src/chh-installer_${{ env.CHH_VERSION }}.elf

  # ── Build chh-host.exe on Windows ─────────────────────────────────────────
  build-host-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout console-homebrew-hub
        uses: actions/checkout@v4

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build chh-host.exe
        run: |
          pyinstaller --onefile --name chh-host chh-host.py
          copy dist\chh-host.exe "dist\chh-host_${{ env.CHH_VERSION }}.exe"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: chh-host-exe
          path: |
            dist/chh-host.exe
            dist/chh-host_${{ env.CHH_VERSION }}.exe

  # ── Publish everything to versioned release ───────────────────────────────
  publish:
    runs-on: ubuntu-latest
    needs: [build-elfs, build-host-exe]
    steps:
      - name: Checkout console-homebrew-hub
        uses: actions/checkout@v4

      - name: Download ELF artifacts
        uses: actions/download-artifact@v4
        with:
          name: chh-elfs
          path: release-assets

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: chh-host-exe
          path: release-assets

      - name: Copy chh-host.py
        run: |
          cp chh-host.py release-assets/chh-host.py
          cp chh-host.py release-assets/chh-host_${{ env.CHH_VERSION }}.py
          echo "=== Release assets (CHH files — payload ELFs uploaded separately by update_mirror.yml) ==="
          ls -lh release-assets/

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ env.CHH_VERSION }}"
          BASE="https://github.com/bsk193/console-homebrew-hub/releases/download/${VER}"
          printf '## Downloads\n\n| Platform | File |\n|---|---|\n' > /tmp/notes.md
          printf '| PS5 (installer — run after first jailbreak) | [chh-installer_%s.elf](%s/chh-installer_%s.elf) |\n' "$VER" "$BASE" "$VER" >> /tmp/notes.md
          printf '| Linux / macOS / WSL (host server) | [chh-host_%s.py](%s/chh-host_%s.py) |\n' "$VER" "$BASE" "$VER" >> /tmp/notes.md
          printf '| Windows (host server) | [chh-host_%s.exe](%s/chh-host_%s.exe) |\n' "$VER" "$BASE" "$VER" >> /tmp/notes.md
          printf '\nMirrored PS5 payload ELFs are also included in this release and auto-updated daily.\n' >> /tmp/notes.md
          gh release create "${VER}" \
            --title "Console Homebrew Hub ${VER}" \
            --notes-file /tmp/notes.md \
            --latest=true 2>/dev/null || true
          gh release edit "${VER}" \
            --title "Console Homebrew Hub ${VER}" \
            --notes-file /tmp/notes.md 2>/dev/null || true
          gh release upload "${VER}" release-assets/* --clobber
          echo "Published: $(gh release view "${VER}" --json assets --jq '.assets|length') assets"
