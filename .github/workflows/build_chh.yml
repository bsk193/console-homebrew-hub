name: Build Console Homebrew Hub Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  CHH_VERSION: ${{ github.ref_name }}

jobs:
  # ── Build CHH ELFs (requires PS5 SDK via Docker) ─────────────────────────
  build-elfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout console-homebrew-hub
        uses: actions/checkout@v4
        with:
          path: chh

      - name: Clone ps5-webkit-autoloader-x
        run: |
          git clone --recurse-submodules --depth=1 \
            https://github.com/bsk193/ps5-webkit-autoloader-x.git autoloader-src

      - name: Patch autoloader-x for CHH
        run: |
          # Copy CHH-specific C source files from the CHH repo
          cp chh/chh-src/main_shortcut.c  autoloader-src/src/main_shortcut.c

          # Append CHH extension function to app_installer.c
          cat chh/chh-src/app_installer_chh_patch.c >> autoloader-src/src/app_installer.c

          # (declaration is forward-declared inside main_shortcut.c)

          # Append CHH Makefile targets (Python writes tabs correctly)
          python3 - << 'PYEOF'
          T = '\t'
          lines = [
              '',
              '# Console Homebrew Hub targets',
              'CHH_INSTALLER_SRCS := src/main_shortcut.c src/app_installer.c src/notification.c src/log.c',
              'CHH_INSTALLER_LIBS := $(LOCAL_LIBS)',
              '',
              '.PHONY: chh',
              'chh: chh-installer.elf',
              '',
              'chh-installer.elf: version $(CHH_INSTALLER_SRCS)',
              T + '$(CC) $(CFLAGS) $(LDFLAGS) -o chh-installer.elf $(CHH_INSTALLER_SRCS) $(CHH_INSTALLER_LIBS)',
              T + '$(STRIP) chh-installer.elf',
              '',
          ]
          with open('autoloader-src/Makefile', 'a') as f:
              f.write('\n'.join(lines) + '\n')
          print('Patched Makefile')
          PYEOF

          echo "All patches applied."

      - name: Cache Docker SDK image
        id: cache-docker
        uses: actions/cache@v4
        with:
          path: /tmp/ps5-sdk-image.tar
          key: ps5-sdk-${{ hashFiles('autoloader-src/Dockerfile.sdk') }}

      - name: Load cached Docker image
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: docker load -i /tmp/ps5-sdk-image.tar

      - name: Build Docker SDK image
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: docker build -t ps5-webkit-autoloader-sdk -f autoloader-src/Dockerfile.sdk autoloader-src/

      - name: Save Docker image for cache
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: docker save ps5-webkit-autoloader-sdk -o /tmp/ps5-sdk-image.tar

      - name: Build CHH ELF
        run: |
          docker run --rm -u "$(id -u):$(id -g)" \
            -v "$(pwd)/autoloader-src:/work" -w /work \
            ps5-webkit-autoloader-sdk \
            make chh
          cp autoloader-src/chh-installer.elf autoloader-src/chh-installer_${{ env.CHH_VERSION }}.elf
          ls -lh autoloader-src/chh-installer*.elf

      - name: Upload ELF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chh-elfs
          path: |
            autoloader-src/chh-installer.elf
            autoloader-src/chh-installer_${{ env.CHH_VERSION }}.elf

  # ── Build chh-host.exe on Windows ─────────────────────────────────────────
  build-host-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout console-homebrew-hub
        uses: actions/checkout@v4

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build chh-host.exe
        run: |
          pyinstaller --onefile --name chh-host chh-host.py
          copy dist\chh-host.exe "dist\chh-host_${{ env.CHH_VERSION }}.exe"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: chh-host-exe
          path: |
            dist/chh-host.exe
            dist/chh-host_${{ env.CHH_VERSION }}.exe

  # ── Publish everything to versioned release ───────────────────────────────
  publish:
    runs-on: ubuntu-latest
    needs: [build-elfs, build-host-exe]
    steps:
      - name: Checkout console-homebrew-hub
        uses: actions/checkout@v4

      - name: Download ELF artifacts
        uses: actions/download-artifact@v4
        with:
          name: chh-elfs
          path: release-assets

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: chh-host-exe
          path: release-assets

      - name: Copy chh-host.py
        run: |
          cp chh-host.py release-assets/chh-host.py
          cp chh-host.py release-assets/chh-host_${{ env.CHH_VERSION }}.py
          echo "=== Release assets (CHH files — payload ELFs uploaded separately by update_mirror.yml) ==="
          ls -lh release-assets/

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ env.CHH_VERSION }}"
          BASE="https://github.com/bsk193/console-homebrew-hub/releases/download/${VER}"
          printf '## Downloads\n\n| Platform | File |\n|---|---|\n' > /tmp/notes.md
          printf '| PS5 (installer — run after first jailbreak) | [chh-installer_%s.elf](%s/chh-installer_%s.elf) |\n' "$VER" "$BASE" "$VER" >> /tmp/notes.md
          printf '| Linux / macOS / WSL (host server) | [chh-host_%s.py](%s/chh-host_%s.py) |\n' "$VER" "$BASE" "$VER" >> /tmp/notes.md
          printf '| Windows (host server) | [chh-host_%s.exe](%s/chh-host_%s.exe) |\n' "$VER" "$BASE" "$VER" >> /tmp/notes.md
          printf '\nMirrored PS5 payload ELFs are also included in this release and auto-updated daily.\n' >> /tmp/notes.md
          gh release create "${VER}" \
            --title "Console Homebrew Hub ${VER}" \
            --notes-file /tmp/notes.md \
            --latest=true 2>/dev/null || true
          gh release edit "${VER}" \
            --title "Console Homebrew Hub ${VER}" \
            --notes-file /tmp/notes.md 2>/dev/null || true
          gh release upload "${VER}" release-assets/* --clobber
          echo "Published: $(gh release view "${VER}" --json assets --jq '.assets|length') assets"
