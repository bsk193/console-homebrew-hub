<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHH Installer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#06060f;display:flex;align-items:center;justify-content:center;min-height:100vh;font:500 14px system-ui;color:#dde4f2;flex-direction:column;gap:16px;padding:20px}
.card{background:#0c0c1a;border:1px solid #1c1c30;border-radius:16px;padding:24px;width:100%;max-width:340px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#4f87ff,#1957c8);display:flex;align-items:center;justify-content:center;font:800 14px/1 system-ui;color:#fff}
h1{font:700 18px/1.2 system-ui;color:#fff}
.msg{font:400 13px/1.5 system-ui;color:#50608a}
.progress{width:100%;height:4px;background:#1c1c30;border-radius:2px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#4f87ff,#1dd17a);border-radius:2px;transition:width .3s}
.status{font:400 12px/1 system-ui;color:#50608a}
.log{width:100%;max-width:340px;background:#000;border:1px solid #1c1c30;border-radius:8px;max-height:140px;overflow-y:auto;padding:6px 8px;font:400 11px/1.5 monospace;color:#50608a;display:none}
.log div{margin-bottom:2px}
.log .ok{color:#1dd17a}
.log .err{color:#f43f5e}
</style>
</head>
<body>
<div class="card">
  <div class="logo">CHH</div>
  <h1>Console Homebrew Hub</h1>
  <div class="msg" id="msg">Loading&hellip;</div>
  <div class="progress" id="progress" style="display:none"><div class="bar" id="bar"></div></div>
  <div class="status" id="status"></div>
</div>
<div class="log" id="log"></div>
<script>
(function() {
  var APP_URL = '/ps5/index.html';
  var msg = document.getElementById('msg');
  var progress = document.getElementById('progress');
  var bar = document.getElementById('bar');
  var status = document.getElementById('status');
  var logEl = document.getElementById('log');
  var cache = window.applicationCache;
  var completed = false;
  var probeOk = false;

  function appendLog(t, cls) {
    logEl.style.display = '';
    var d = document.createElement('div');
    d.textContent = t;
    if (cls) d.className = cls;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function goToApp() {
    window.location.replace(APP_URL);
  }

  function setProgress(pct) {
    bar.style.width = pct + '%';
  }

  function installApp() {
    if (completed) return;
    completed = true;
    msg.textContent = 'Installing shortcut…';
    appendLog('[CHH] Cache complete — installing shortcut...', 'ok');
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/install', true);
    xhr.timeout = 30000;
    xhr.onload = function() {
      if (xhr.status === 200) {
        setProgress(100);
        msg.textContent = 'Installed!';
        msg.style.color = '#1dd17a';
        status.textContent = 'CHH shortcut added to homescreen';
        appendLog('[CHH] Shortcut installed successfully!', 'ok');
      } else {
        msg.textContent = 'Install failed';
        status.textContent = 'Cache is ready but shortcut could not be created';
        appendLog('[CHH] /install returned ' + xhr.status, 'err');
      }
    };
    xhr.onerror = function() {
      msg.textContent = 'Install failed';
      status.textContent = 'Could not reach installer';
      appendLog('[CHH] /install request failed', 'err');
    };
    xhr.ontimeout = function() {
      msg.textContent = 'Install timed out';
      appendLog('[CHH] /install timed out', 'err');
    };
    xhr.send();
  }

  function probeServer() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/version', true);
    xhr.timeout = 3000;
    xhr.onload = function() {
      if (xhr.status === 200) {
        probeOk = true;
        msg.textContent = 'Caching content…';
        status.textContent = 'Do not close this page';
        progress.style.display = '';
        appendLog('[CHH] Server connected, version: ' + xhr.responseText);
      } else {
        appendLog('[CHH] Server responded with ' + xhr.status + ', going to app');
        goToApp();
      }
    };
    xhr.onerror = function() {
      appendLog('[CHH] Server offline — loading cached app');
      goToApp();
    };
    xhr.ontimeout = function() {
      appendLog('[CHH] Server timeout — loading cached app');
      goToApp();
    };
    xhr.send();
  }

  if (!cache) {
    appendLog('[CHH] No AppCache support — redirecting');
    goToApp();
    return;
  }

  cache.addEventListener('checking', function() {
    appendLog('[AppCache] Checking manifest...');
    progress.style.display = '';
  });
  cache.addEventListener('downloading', function() {
    appendLog('[AppCache] Downloading cache...');
  });
  cache.addEventListener('progress', function(e) {
    if (e.url) appendLog('[AppCache] ' + e.url.split('/').pop());
    if (e.total && e.total > 0) {
      var pct = Math.min(99, Math.round((e.loaded / e.total) * 100));
      setProgress(pct);
      status.textContent = e.loaded + ' / ' + e.total + ' files';
    }
  });
  cache.addEventListener('cached', function() {
    appendLog('[AppCache] Caching complete.', 'ok');
    installApp();
  });
  cache.addEventListener('noupdate', function() {
    appendLog('[AppCache] Already up to date.', 'ok');
    installApp();
  });
  cache.addEventListener('updateready', function() {
    appendLog('[AppCache] Update ready — swapping cache.', 'ok');
    try { cache.swapCache(); } catch(e) {}
    installApp();
  });
  cache.addEventListener('error', function() {
    appendLog('[AppCache] Error! Status: ' + cache.status, 'err');
  });
  cache.addEventListener('obsolete', function() {
    appendLog('[AppCache] Manifest obsolete.', 'err');
  });

  window.addEventListener('load', function() {
    probeServer();

    var waitTimer = setInterval(function() {
      if (completed) { clearInterval(waitTimer); return; }
      if (!probeOk) return;
      if (cache.status === cache.IDLE) {
        clearInterval(waitTimer);
        installApp();
      }
    }, 1000);

    setTimeout(function() {
      if (!completed && probeOk) {
        msg.textContent = 'Caching is taking unusually long';
        status.textContent = 'If this never completes, close and re-run the installer';
        appendLog('[CHH] 2-minute timeout — still caching', 'err');
      }
    }, 120000);
  });
})();
</script>
</body>
</html>
